name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress -f project/pom.xml clean verify

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: client_home/package-lock.json
      - name: Install locked dependencies
        working-directory: client_home
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Build H5 client
        working-directory: client_home
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

  repository-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject generated or sensitive artifacts
        shell: bash
        run: |
          tracked=$(git ls-files | grep -E '(^|/)(node_modules|target|dist|unpackage|uploads|logs|\.idea)(/|$)|(^|/)\.env($|\.)|\.(pem|key|p12|jks|dump|bak)$' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Disallowed tracked artifacts:"
            echo "$tracked"
            exit 1
          fi
      - name: Scan every commit for credential patterns
        shell: bash
        run: |
          failed=0
          while read -r revision; do
            if git grep -nI -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' "$revision" -- ':!docs/superpowers/**'; then
              failed=1
            fi
            if git grep -nI -P -- "(?i)(api[_-]?key|secret[_-]?key|client_secret|password)\\s*[:=]\\s*['\"](?!FAKE_)[A-Za-z0-9/+_.-]{16,}['\"]" "$revision" -- ':!*.lock' ':!**/package-lock.json' ':!.env.example' ':!docs/superpowers/**'; then
              failed=1
            fi
            if git grep -nI -P -- '(?i)^\s*(api[_-]?key|secret[_-]?key|client_secret|password)\s*[:=]\s*(?!\$\{|FAKE_|replace_)[A-Za-z0-9/+_.-]{16,}\s*$' "$revision" -- ':!*.lock' ':!**/package-lock.json' ':!.env.example' ':!docs/superpowers/**'; then
              failed=1
            fi
          done < <(git rev-list --all)
          if [ "$failed" -ne 0 ]; then
            echo "Potential secret found; review before publishing."
            exit 1
          fi
