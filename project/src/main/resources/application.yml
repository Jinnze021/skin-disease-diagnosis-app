server:
  port: ${SERVER_PORT:5000}
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/project_db?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=utf-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: ALWAYS
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:2}
    lettuce:
      pool:
        max-idle: 10
        min-idle: 1
        max-active: 20
        max-wait: 5s
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  easydl:
    enabled: ${EASYDL_ENABLED:false}
    api-key: ${EASYDL_API_KEY:}
    secret-key: ${EASYDL_SECRET_KEY:}
    token-url: ${EASYDL_TOKEN_URL:https://aip.baidubce.com/oauth/2.0/token}
    model-url: ${EASYDL_MODEL_URL:}
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
    max-bytes: 5242880
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8080}
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:false}
    hmac-key: ${PASSWORD_RESET_HMAC_KEY:}

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.project.demo.entity
  configuration:
    use-column-label: true
    map-underscore-to-camel-case: false
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    use-generated-keys: true
